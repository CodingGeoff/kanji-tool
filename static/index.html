<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日语汉字学习工具</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#2b2b2b; --sub:#8a8578;
  --accent:#b5495b; --accent2:#2d6a4f; --line:#e7e2d8; --gold:#c8a24b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Noto Sans JP","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header h1{font-size:19px;letter-spacing:1px}
header h1 span{color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:none;background:none;padding:8px 14px;font-size:14px;cursor:pointer;border-radius:8px;color:var(--sub)}
nav button.active{background:var(--accent);color:#fff}
nav button .badge{background:var(--gold);color:#fff;border-radius:9px;padding:1px 7px;font-size:11px;margin-left:4px}
main{max-width:980px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button.btn{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:9px;cursor:pointer;font-size:14px}
button.btn:hover{border-color:var(--accent);color:var(--accent)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.green{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.btn.warn{background:#c77f38;border-color:#c77f38;color:#fff}
button.btn.danger{color:#b5495b}
input,textarea,select{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:14px;font-family:inherit;background:#fff}
textarea{width:100%;min-height:90px;resize:vertical}
ruby{ruby-position:over}
rt{font-size:0.5em;color:var(--accent);font-weight:400;letter-spacing:0}
/* 存疑读音：琥珀色注音 + 底部点线，低调但可辨识 */
ruby.doubt rt{color:#c77f38}
ruby.doubt{border-bottom:2px dotted #e3c08a;cursor:help}
.spkbtn{border:none;background:none;cursor:pointer;font-size:15px;opacity:.55;padding:2px 4px;border-radius:6px;vertical-align:middle}
.spkbtn:hover{opacity:1;background:#f2efe7}
.spkbtn.playing{opacity:1}
.spkbtn.big{font-size:20px}
select.mini{padding:4px 8px;font-size:12px;border-radius:7px;color:var(--sub)}
.jp{font-size:26px;line-height:2.3}
.jp .unk{border-bottom:2px dotted #c77f38}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{font-size:28px;display:block;color:var(--accent)}
.stat.g b{color:var(--accent2)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.ktile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;position:relative}
.ktile:hover{border-color:var(--accent)}
.ktile .k{font-size:30px}
.ktile .f{font-size:11px;color:var(--sub)}
.ktile .st{position:absolute;top:5px;right:7px;font-size:10px;color:var(--accent2)}
.review-card{text-align:center;padding:34px 20px}
.review-card .big{font-size:84px;line-height:1.2}
.review-card .stage{font-size:12px;color:var(--sub);margin-top:4px}
.sent-item{border-bottom:1px dashed var(--line);padding:13px 2px}
.sent-item:last-child{border:none}
.sent-item .tr{color:var(--sub);font-size:14px;margin-top:2px}
.sent-item .meta{font-size:12px;color:#b9b3a4;margin-top:4px;display:flex;gap:10px;align-items:center}
.sent-item .meta button{border:none;background:none;color:#b9b3a4;cursor:pointer;font-size:12px;padding:0}
.sent-item .meta button:hover{color:var(--accent)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--sub)}
.hidden{display:none!important}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px}
.wordchip{display:inline-block;background:#f2efe7;border-radius:8px;padding:3px 10px;margin:3px;font-size:15px}
.wordchip small{color:var(--accent);margin-left:5px}
.hist-item{padding:8px 4px;border-bottom:1px dashed var(--line);font-size:13px;display:flex;gap:12px}
.hist-item .t{color:var(--sub);white-space:nowrap}
.reveal-area{min-height:60px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 22px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
#toast.show{opacity:1}
.progressbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}
.progressbar i{display:block;height:100%;background:var(--accent2);transition:.3s}
@media(max-width:600px){.jp{font-size:21px}.review-card .big{font-size:64px}}
</style>
</head>
<body>
<header>
  <h1>日语<span>汉字</span>学习</h1>
  <nav id="nav">
    <button data-tab="review" class="active">今日复习<span class="badge hidden" id="dueBadge"></span></button>
    <button data-tab="learn">学新字</button>
    <button data-tab="corpus">语料库</button>
    <button data-tab="kanji">汉字库</button>
    <button data-tab="subtitle">字幕注音</button>
    <button data-tab="history">统计·历史</button>
  </nav>
  <div class="row" style="margin-left:auto;gap:6px">
    <select id="voiceSel" class="mini" title="朗读音色"></select>
    <select id="rateSel" class="mini" title="朗读语速">
      <option value="slow">慢速</option>
      <option value="slower">稍慢</option>
      <option value="normal" selected>正常</option>
      <option value="fast">稍快</option>
    </select>
  </div>
</header>
<main>

<!-- ============ 复习 ============ -->
<section id="tab-review">
  <div class="stat-grid" id="reviewStats"></div>
  <div class="card" id="reviewBox" style="margin-top:14px">
    <div class="muted">加载中…</div>
  </div>
</section>

<!-- ============ 学新字 ============ -->
<section id="tab-learn" class="hidden">
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div><b>推荐新汉字</b><span class="muted">（按本地语料出现频次排序，学高频字性价比最高）</span></div>
      <div class="row">
        <button class="btn" onclick="loadNew()">换一批</button>
        <button class="btn primary" onclick="learnAllShown()">全部加入学习</button>
      </div>
    </div>
    <div id="newList" style="margin-top:14px"></div>
  </div>
</section>

<!-- ============ 语料库 ============ -->
<section id="tab-corpus" class="hidden">
  <div class="card">
    <div class="row">
      <b>抓取语料</b>
      <button class="btn green" onclick="doFetch('tatoeba')">Tatoeba 例句</button>
      <button class="btn green" onclick="doFetch('wikipedia')">维基百科</button>
      <button class="btn green" onclick="doFetch('wikinews')">维基新闻</button>
      <span class="muted" id="fetchStatus"></span>
    </div>
    <div class="muted" style="margin-top:8px">后台每 10 分钟自动抓取扩充；所有语料缓存到本地 SQLite，优先离线读取。</div>
  </div>
  <div class="card">
    <div class="row">
      <input id="corpusQ" placeholder="搜索句子/翻译…" style="flex:1;min-width:160px" onkeydown="if(event.key==='Enter')loadCorpus(1)">
      <button class="btn" onclick="loadCorpus(1)">搜索</button>
      <button class="btn primary" onclick="toggleAddForm()">＋ 手动添加</button>
    </div>
    <div id="addForm" class="hidden" style="margin-top:12px">
      <textarea id="addText" placeholder="日语句子（自动注音）"></textarea>
      <input id="addTrans" placeholder="翻译（可选）" style="width:100%;margin-top:8px">
      <div class="row" style="margin-top:8px"><button class="btn primary" onclick="addSentence()">保存</button></div>
    </div>
    <div id="corpusList" style="margin-top:6px"></div>
    <div class="pager" id="corpusPager"></div>
  </div>
</section>

<!-- ============ 汉字库 ============ -->
<section id="tab-kanji" class="hidden">
  <div class="card">
    <div class="row">
      <select id="kanjiFilter" onchange="loadKanji(1)">
        <option value="">全部汉字</option>
        <option value="1">学习中</option>
        <option value="0">未学习</option>
      </select>
      <input id="kanjiQ" placeholder="查单个汉字" maxlength="1" style="width:110px" onkeydown="if(event.key==='Enter')loadKanji(1)">
      <button class="btn" onclick="loadKanji(1)">查询</button>
      <span class="muted" id="kanjiTotal"></span>
    </div>
    <div class="kgrid" id="kanjiGrid" style="margin-top:14px"></div>
    <div class="pager" id="kanjiPager"></div>
  </div>
  <div class="card hidden" id="kanjiDetail"></div>
</section>

<!-- ============ 字幕注音 ============ -->
<section id="tab-subtitle" class="hidden">
  <div class="card">
    <b>字幕 / 任意日文注音</b>
    <div class="muted" style="margin:6px 0 10px">把看不懂的字幕、台词直接贴进来，逐字标注平假名（多音字按上下文取音）。</div>
    <textarea id="subText" style="min-height:120px" placeholder="例：彼女は行方不明になった。&#10;今日は一人で映画を見た。"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" onclick="annotate()">注音</button>
      <label class="muted"><input type="checkbox" id="hideRuby" onchange="document.getElementById('subOut').classList.toggle('noruby',this.checked)"> 隐藏注音（自测模式，悬停显示）</label>
    </div>
    <div class="muted" style="margin-top:8px">红色假名=双引擎校验注音；<span style="color:#c77f38;border-bottom:2px dotted #e3c08a">琥珀色+点线</span>=存在其他读法候选，悬停查看；橙色虚线=词典未收录（拒绝猜测）。点 🔊 朗读整句，右上角可换音色和语速。</div>
    <div id="subOut" class="jp" style="margin-top:16px"></div>
  </div>
</section>

<!-- ============ 历史 ============ -->
<section id="tab-history" class="hidden">
  <div class="stat-grid" id="histStats"></div>
  <div class="card" style="margin-top:14px">
    <div class="row" style="justify-content:space-between">
      <b>操作历史</b>
      <button class="btn danger" onclick="clearHistory()">清空历史</button>
    </div>
    <div id="histList" style="margin-top:8px"></div>
  </div>
</section>

</main>
<div id="toast"></div>

<style>
.noruby rt{visibility:hidden}
.noruby ruby:hover rt{visibility:visible}
</style>

<script>
const $=s=>document.querySelector(s);
const api=(u,opt)=>fetch(u,opt?Object.assign({headers:{'Content-Type':'application/json'}},opt):undefined).then(r=>r.json());
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function esc(s){return (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function rubyHTML(tokens,hi){
  return tokens.map(t=>{
    const s=esc(t.s);
    const cls=(hi&&t.s.includes(hi))?' style="color:var(--accent);font-weight:600"':'';
    if(t.unk) return `<span class="unk" title="词典未收录，读音未知（不猜测）">${s}</span>`;
    if(t.r){
      const low=t.c==='low', alt=(t.alt&&t.alt.length)?`其他读法候选: ${t.alt.join(' / ')}`:'';
      const title=alt?` title="${esc(alt)}"`:'';
      // 存疑读音：仅用低调的琥珀色注音+底部点线提示，悬停看候选
      return `<ruby class="${low?'doubt':''}"${cls}${title}>${s}<rt>${esc(t.r)}</rt></ruby>`;
    }
    return `<span${cls}>${s}</span>`;
  }).join('');
}

/* ---------- 朗读 (TTS) ---------- */
let _audio=null;
function spkBtn(text,size){
  return `<button class="spkbtn${size?' '+size:''}" data-text="${esc(text)}" title="朗读">🔊</button>`;
}
document.addEventListener('click', async e=>{
  const btn=e.target.closest('.spkbtn'); if(!btn) return;
  const text=btn.dataset.text; if(!text) return;
  if(_audio){_audio.pause();_audio=null;}
  document.querySelectorAll('.spkbtn.playing').forEach(b=>b.classList.remove('playing'));
  btn.classList.add('playing'); btn.textContent='…';
  try{
    const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text,voice:localStorage.voice||'',rate:localStorage.rate||'normal'})});
    if(!r.ok) throw new Error('tts');
    const url=URL.createObjectURL(await r.blob());
    _audio=new Audio(url);
    btn.textContent='◼';
    _audio.onended=()=>{btn.textContent='🔊';btn.classList.remove('playing');URL.revokeObjectURL(url);_audio=null;};
    await _audio.play();
  }catch(err){
    // 服务端不可用时退回浏览器本地语音
    try{
      const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';
      const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ja'));
      if(v)u.voice=v; speechSynthesis.speak(u);
      u.onend=()=>{btn.textContent='🔊';btn.classList.remove('playing');};
    }catch(e2){toast('朗读不可用');btn.textContent='🔊';btn.classList.remove('playing');}
  }
});
async function initVoices(){
  const d=await api('/api/voices');
  const sel=$('#voiceSel');
  sel.innerHTML=d.voices.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('');
  if(localStorage.voice) sel.value=localStorage.voice;
  localStorage.voice=sel.value;
  sel.onchange=()=>localStorage.voice=sel.value;
  const rs=$('#rateSel');
  if(localStorage.rate) rs.value=localStorage.rate;
  localStorage.rate=rs.value;
  rs.onchange=()=>localStorage.rate=rs.value;
}
function fmtTime(ts){if(!ts)return '—';const d=new Date(ts*1000);return d.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}

/* ---------- 导航 ---------- */
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));
  $('#tab-'+b.dataset.tab).classList.remove('hidden');
  ({review:loadReview,learn:loadNew,corpus:()=>loadCorpus(1),kanji:()=>loadKanji(1),history:loadHistory}[b.dataset.tab]||(()=>{}))();
});

/* ---------- 统计 ---------- */
async function refreshStats(){
  const s=await api('/api/stats');
  $('#dueBadge').textContent=s.srs.due; $('#dueBadge').classList.toggle('hidden',!s.srs.due);
  $('#reviewStats').innerHTML=`
    <div class="stat"><b>${s.srs.due}</b>待复习</div>
    <div class="stat g"><b>${s.srs.total}</b>学习中汉字</div>
    <div class="stat g"><b>${s.srs.mature}</b>已长期记忆</div>
    <div class="stat"><b>${s.sentences}</b>本地语料(句)</div>`;
  $('#histStats').innerHTML=`
    <div class="stat"><b>${s.sentences}</b>语料总量</div>
    <div class="stat"><b>${s.kanji}</b>覆盖汉字数</div>
    <div class="stat g"><b>${s.srs.reviewed_today}</b>今日已复习</div>
    <div class="stat g"><b>${s.srs.mature}</b>长期记忆汉字</div>`;
  $('#fetchStatus').textContent=s.fetching?'后台抓取中…':(s.last_fetch?`上次抓取 ${fmtTime(s.last_fetch)}（+${s.last_added}句）`:'');
  return s;
}

/* ---------- 复习 ---------- */
let queue=[],qTotal=0,stageNames=[];
async function loadReview(){
  await refreshStats();
  const d=await api('/api/review/due');
  queue=d.rows; qTotal=queue.length; stageNames=d.stage_names;
  showCard();
}
function showCard(){
  const box=$('#reviewBox');
  if(!queue.length){
    box.innerHTML=`<div class="review-card"><div style="font-size:44px">🎉</div>
      <p style="margin-top:10px">当前没有到期的汉字</p>
      <p class="muted" style="margin-top:6px">艾宾浩斯调度会在 5分钟→30分钟→12小时→1天→2天→4天→7天→15天→1月→2月 的记忆临界点自动推送复习。<br>先去「学新字」添加要学的汉字吧。</p></div>`;
    refreshStats();return;
  }
  const it=queue[0];
  const done=qTotal-queue.length;
  box.innerHTML=`
    <div class="progressbar"><i style="width:${qTotal?done/qTotal*100:0}%"></i></div>
    <div class="review-card">
      <div class="big">${esc(it.kanji)}</div>
      <div class="stage">阶段 ${stageNames[it.stage]||it.stage} ｜ 对${it.ok}次 错${it.ng}次</div>
      <div class="reveal-area" id="reveal" style="margin-top:18px">
        ${it.sentence?`<div class="jp noruby" id="revSent">${rubyHTML(it.sentence.tokens,it.kanji)} ${spkBtn(it.sentence.text,'big')}</div>
          <div class="muted" id="revTr" style="visibility:hidden">${esc(it.sentence.translation||'')}</div>`:'<div class="muted">语料库暂无此字例句，先抓取更多语料</div>'}
      </div>
      <div class="row" style="justify-content:center;margin-top:22px" id="ansBtns">
        <button class="btn primary" onclick="reveal()">显示读音</button>
      </div>
    </div>`;
}
function reveal(){
  const s=$('#revSent'); if(s)s.classList.remove('noruby');
  const tr=$('#revTr'); if(tr)tr.style.visibility='visible';
  $('#ansBtns').innerHTML=`
    <button class="btn green" onclick="answer('ok')">😀 认识</button>
    <button class="btn warn" onclick="answer('hard')">🤔 模糊</button>
    <button class="btn" style="border-color:var(--accent);color:var(--accent)" onclick="answer('ng')">😵 忘记</button>`;
}
async function answer(r){
  const it=queue.shift();
  await api('/api/review/answer',{method:'POST',body:JSON.stringify({kanji:it.kanji,result:r})});
  showCard();
}

/* ---------- 学新字 ---------- */
let shownNew=[];
async function loadNew(){
  const d=await api('/api/learn/new?limit=10');
  shownNew=d.rows.map(r=>r.kanji);
  $('#newList').innerHTML=d.rows.length?d.rows.map(r=>`
    <div class="sent-item row" style="justify-content:space-between">
      <div class="row">
        <span style="font-size:38px;width:52px;text-align:center">${esc(r.kanji)}</span>
        <div>
          <div>${(r.words||[]).map(w=>`<span class="wordchip">${esc(w.word)}<small>${esc(w.word_reading||'')}</small></span>`).join('')}</div>
          <div class="muted">出现于 ${r.freq} 句语料</div>
        </div>
      </div>
      <button class="btn primary" onclick="learnOne('${r.kanji}',this)">加入学习</button>
    </div>`).join(''):'<div class="muted">语料库为空，请先到「语料库」抓取语料</div>';
}
async function learnOne(k,btn){
  await api('/api/learn',{method:'POST',body:JSON.stringify({kanji:k})});
  btn.textContent='✓ 已加入';btn.disabled=true;toast(`「${k}」已加入学习，5分钟后进入首次复习`);refreshStats();
}
async function learnAllShown(){
  if(!shownNew.length)return;
  await api('/api/learn',{method:'POST',body:JSON.stringify({kanji:shownNew})});
  toast(`已加入 ${shownNew.length} 个汉字`);loadNew();refreshStats();
}

/* ---------- 语料库 ---------- */
async function doFetch(src){
  toast('抓取中，请稍候…');
  const d=await api('/api/fetch',{method:'POST',body:JSON.stringify({source:src})});
  toast(`新增 ${d.added} 句语料`);loadCorpus(1);refreshStats();
}
function toggleAddForm(){$('#addForm').classList.toggle('hidden')}
async function addSentence(){
  const d=await api('/api/sentences',{method:'POST',body:JSON.stringify({text:$('#addText').value,translation:$('#addTrans').value})});
  if(d.error)return toast(d.error);
  $('#addText').value='';$('#addTrans').value='';toast('已添加并自动注音');loadCorpus(1);
}
async function loadCorpus(page){
  const q=encodeURIComponent($('#corpusQ').value||'');
  const d=await api(`/api/sentences?page=${page}&q=${q}`);
  $('#corpusList').innerHTML=d.rows.map(r=>`
    <div class="sent-item" id="sent-${r.id}">
      <div class="jp" style="font-size:22px">${rubyHTML(r.tokens)} ${spkBtn(r.text)}</div>
      ${r.translation?`<div class="tr">${esc(r.translation)}</div>`:''}
      <div class="meta">
        <span class="tag">${esc(r.source)}</span><span>#${r.id}</span><span>${fmtTime(r.created_at)}</span>
        <button onclick="editSentence(${r.id},this)">编辑</button>
        <button onclick="delSentence(${r.id})">删除</button>
      </div>
    </div>`).join('')||'<div class="muted" style="padding:14px 0">暂无语料，点上方按钮抓取</div>';
  const pages=Math.max(1,Math.ceil(d.total/20));
  $('#corpusPager').innerHTML=`
    <button class="btn" ${page<=1?'disabled':''} onclick="loadCorpus(${page-1})">上一页</button>
    <span class="muted">${page}/${pages} · 共${d.total}句</span>
    <button class="btn" ${page>=pages?'disabled':''} onclick="loadCorpus(${page+1})">下一页</button>`;
}
async function editSentence(id){
  const el=$(`#sent-${id}`);
  const text=prompt('修改句子（将重新注音）：',el.querySelector('.jp').textContent.replace(/\s+/g,''));
  if(text===null)return;
  const tr=prompt('修改翻译：',el.querySelector('.tr')?.textContent||'');
  await api(`/api/sentences/${id}`,{method:'PUT',body:JSON.stringify({text,translation:tr})});
  toast('已更新');loadCorpus(1);
}
async function delSentence(id){
  if(!confirm('确认删除这条语料？'))return;
  await api(`/api/sentences/${id}`,{method:'DELETE'});toast('已删除');loadCorpus(1);
}

/* ---------- 汉字库 ---------- */
async function loadKanji(page){
  const learned=$('#kanjiFilter').value,q=encodeURIComponent($('#kanjiQ').value||'');
  const d=await api(`/api/kanji?page=${page}&learned=${learned}&q=${q}`);
  $('#kanjiTotal').textContent=`共 ${d.total} 字`;
  $('#kanjiGrid').innerHTML=d.rows.map(r=>`
    <div class="ktile" onclick="kanjiDetail('${r.kanji}')">
      ${r.stage!=null?'<span class="st">●学</span>':''}
      <div class="k">${esc(r.kanji)}</div><div class="f">${r.freq}句</div>
    </div>`).join('')||'<div class="muted">暂无数据</div>';
  const pages=Math.max(1,Math.ceil(d.total/60));
  $('#kanjiPager').innerHTML=pages>1?`
    <button class="btn" ${page<=1?'disabled':''} onclick="loadKanji(${page-1})">上一页</button>
    <span class="muted">${page}/${pages}</span>
    <button class="btn" ${page>=pages?'disabled':''} onclick="loadKanji(${page+1})">下一页</button>`:'';
}
async function kanjiDetail(k){
  const d=await api('/api/kanji/'+encodeURIComponent(k));
  const box=$('#kanjiDetail');box.classList.remove('hidden');
  box.innerHTML=`
    <div class="row" style="justify-content:space-between">
      <div class="row"><span style="font-size:46px">${esc(k)}</span>
        <div>${d.words.map(w=>`<span class="wordchip">${esc(w.word)}<small>${esc(w.word_reading||'')}</small></span>`).join('')}</div>
      </div>
      <div class="row">
        <button class="btn primary" onclick="learnOne('${k}',this)">加入学习</button>
        <button class="btn danger" onclick="api('/api/learn/${k}',{method:'DELETE'}).then(()=>{toast('已移除学习记录');loadKanji(1)})">移除学习</button>
      </div>
    </div>
    <div style="margin-top:10px">${d.sentences.map(s=>`
      <div class="sent-item"><div class="jp" style="font-size:21px">${rubyHTML(s.tokens,k)} ${spkBtn(s.text)}</div>
      ${s.translation?`<div class="tr muted">${esc(s.translation)}</div>`:''}</div>`).join('')||'<div class="muted">暂无例句</div>'}
    </div>`;
  box.scrollIntoView({behavior:'smooth'});
}

/* ---------- 字幕注音 ---------- */
async function annotate(){
  const text=$('#subText').value;if(!text.trim())return;
  const d=await api('/api/annotate',{method:'POST',body:JSON.stringify({text})});
  const raws=text.split('\n');
  $('#subOut').innerHTML=d.lines.map((l,i)=>l.length?`<div>${rubyHTML(l)} ${spkBtn(raws[i]||'')}</div>`:'<br>').join('');
}

/* ---------- 历史 ---------- */
const typeLabel={fetch:'📥抓取',review:'📖复习',learn:'✏️学习',add:'➕添加',edit:'✍️编辑',delete:'🗑️删除',remove:'🗑️移除',annotate:'🔤注音'};
async function loadHistory(){
  await refreshStats();
  const d=await api('/api/history?limit=150');
  $('#histList').innerHTML=d.rows.map(r=>`
    <div class="hist-item"><span class="t">${fmtTime(r.ts)}</span>
      <span>${typeLabel[r.type]||r.type}</span><span>${esc(r.detail)}</span></div>`).join('')||'<div class="muted">暂无记录</div>';
}
async function clearHistory(){
  if(!confirm('确认清空全部历史记录？'))return;
  await api('/api/history',{method:'DELETE'});loadHistory();
}

/* ---------- 启动 ---------- */
initVoices();
loadReview();
setInterval(refreshStats,60000);
</script>
</body>
</html>
